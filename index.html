<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1408">
<title>왕푸 아저씨네 마라탕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Do+Hyeon&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1408;--brown:#5a3320;--brown2:#7a4a2a;--cream:#f3dcae;--cream2:#fff3d6;--tan:#c9a06a;--yellow:#f6d34a;--red:#d8261a;
  --px:'Press Start 2P','Silkscreen',monospace;--ko:'Do Hyeon','Black Han Sans','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0a04;color:var(--cream2);font-family:var(--ko);
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
button{font-family:inherit}

/* ---------- pixel boxes & buttons (reference style) ---------- */
.pxbox{background:var(--brown);border:3px solid var(--ink);
  box-shadow:inset 0 0 0 3px var(--brown2),0 0 0 3px var(--cream),0 0 0 6px var(--ink),0 8px 0 4px rgba(0,0,0,.35)}
.pxbtn{pointer-events:auto;cursor:pointer;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:6px;
  font-family:var(--px);font-size:16px;line-height:1.25;padding:.65em .9em;letter-spacing:.02em;
  box-shadow:inset -4px -4px 0 var(--tan),inset 4px 4px 0 #fff8e4,0 0 0 3px var(--cream),0 0 0 6px var(--ink),0 7px 0 4px rgba(0,0,0,.4);
  transition:transform .06s}
.pxbtn:active{transform:translateY(3px)}
.pxbtn.red{background:#e0442a;color:#fff3d6;box-shadow:inset -4px -4px 0 #9a1a0c,inset 4px 4px 0 #ff8a6a,0 0 0 3px var(--cream),0 0 0 6px var(--ink),0 7px 0 4px rgba(0,0,0,.4);text-shadow:2px 2px 0 var(--ink)}
.pxbtn.yellow{background:#f6c93a;box-shadow:inset -4px -4px 0 #c88a10,inset 4px 4px 0 #fff2a8,0 0 0 3px var(--cream),0 0 0 6px var(--ink),0 7px 0 4px rgba(0,0,0,.4)}
.pxbtn.ko{font-family:var(--ko);font-size:clamp(17px,3.2vmin,24px);letter-spacing:0}
.pxbtn.big{font-size:16px;padding:.9em 1.4em}
.pxbtn.ko.big{font-size:clamp(22px,4vmin,30px);padding:.45em 1.2em}
.pulse{animation:pulse .9s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.blink{animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.linkbtn{pointer-events:auto;cursor:pointer;background:rgba(43,20,8,.75);border:2px solid var(--tan);color:var(--cream);font-family:var(--ko);
  font-size:clamp(14px,2.4vmin,17px);padding:6px 12px}

#loading{background:#1a0a04;z-index:50;font-family:var(--px);color:var(--yellow);font-size:16px}

/* ---------- title ---------- */
#title{pointer-events:none;justify-content:flex-end;gap:16px;padding:0 16px calc(max(18px,env(safe-area-inset-bottom)) + 8px)}
#title .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
#title .pxbtn,#title .linkbtn{pointer-events:auto}
.wallet{pointer-events:none;font-family:var(--px);font-size:16px;color:var(--yellow);padding:10px 14px;display:flex;align-items:center;gap:8px;text-shadow:2px 2px 0 var(--ink)}
.howto{font-family:var(--ko);font-size:clamp(14px,2.4vmin,17px);color:var(--cream2);padding:8px 14px;text-align:center;line-height:1.4;max-width:560px}
.top-btns{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:20;display:flex;gap:14px}

/* ---------- intro dialog ---------- */
#dialog{position:absolute;left:0;right:0;margin:0 auto;bottom:max(16px,env(safe-area-inset-bottom));
  width:min(calc(100vw - 32px),760px);min-height:clamp(128px,20vh,170px);z-index:10;
  padding:clamp(24px,3.6vh,30px) clamp(16px,3vw,26px) 58px}
#dialog .name{position:absolute;top:-22px;left:16px;background:var(--red);color:var(--cream2);border:3px solid var(--ink);
  box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--ink);padding:5px 12px;font-family:var(--ko);font-size:clamp(16px,2.8vmin,20px);text-shadow:2px 2px 0 var(--ink)}
#dialog .stage{color:var(--yellow);font-size:clamp(13px,2.3vmin,16px);min-height:1.3em;opacity:.9}
#dialog .line{font-size:clamp(20px,3.6vmin,28px);line-height:1.4;color:var(--cream2);text-shadow:2px 2px 0 var(--ink);min-height:1.4em;word-break:keep-all}
#nextBtn{position:absolute;right:16px;bottom:12px}
#skipBtn{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:20}
#goBtn{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(max(16px,env(safe-area-inset-bottom)) + clamp(160px,25vh,210px));z-index:12}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud-l{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));padding:8px 12px;
  font-family:var(--px);font-size:16px;line-height:1.7;text-shadow:2px 2px 0 var(--ink);min-width:clamp(150px,26vmin,250px)}
.hud-l .lab{color:var(--yellow)}
.hud-l .v{color:var(--cream2)}
.hud-l .sm{font-size:8px;opacity:.95}
.hud-r{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.hud-r .row{display:flex;gap:14px;align-items:stretch}
.timer{padding:6px 10px;font-family:var(--px);text-align:center;text-shadow:2px 2px 0 var(--ink);min-width:clamp(58px,10vmin,84px)}
.timer .lab{font-size:8px;color:var(--yellow);margin-bottom:4px}
.timer .v{font-size:24px;color:var(--cream2)}
.timer.hurry .v{color:#ff5a3a;animation:blink .5s steps(1) infinite}
#pauseBtn{font-size:16px}
.hearts{display:flex;gap:4px}
.hearts svg{width:clamp(26px,4.6vmin,40px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.hearts svg.lost .f{fill:#5a2418}.hearts svg.lost .h{fill:#7a3424}
.hearts svg.hit{animation:hit .5s steps(4)}
@keyframes hit{25%{transform:scale(1.4) rotate(-10deg)}75%{transform:scale(.8)}}
#gauge{position:absolute;left:0;right:0;margin:0 auto;width:min(70vw,420px);bottom:calc(var(--bar) + 22px);padding:5px 10px;display:flex;align-items:center;gap:10px;
  font-family:var(--ko);font-size:clamp(13px,2.2vmin,16px);text-shadow:2px 2px 0 var(--ink)}
#gauge .track{flex:1;height:12px;background:#2b1408;border:2px solid #1a0a04;position:relative}
#gauge .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,#f6d34a 0 8px,#f39a1e 8px 16px);transition:width .15s steps(3)}
#gauge .bowls{color:var(--yellow);white-space:nowrap}
#bar{position:absolute;left:0;right:0;bottom:0;height:var(--bar);padding:10px max(16px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));
  background:linear-gradient(#1f2430,#151821);border-top:4px solid var(--ink);box-shadow:0 -3px 0 #3a4152;display:flex;gap:18px;align-items:center;justify-content:center;pointer-events:none}
#bar .pxbtn{flex:1 1 0;min-width:0;max-width:330px;height:calc(100% - 12px);display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;line-height:1.35;text-align:left;padding:0 12px;overflow:hidden}
#bar .ico{flex:0 0 auto;display:block;image-rendering:pixelated}
#bar .ico-arrow{width:42px;height:27px}
#bar .ico-burst{width:33px;height:33px}
#bar .btxt{display:flex;flex-direction:column;justify-content:center;white-space:nowrap;letter-spacing:0;position:relative}
#bar .cmb{font-size:12px;line-height:1.2;min-height:0}
#bar .cmb:empty{display:none}
#swipeBtn{pointer-events:none!important}
#swipeBtn.on{background:#fff3c0}
#swipeBtn .cmb{color:var(--red);font-size:.8em}
#bar.spicy{border-top-color:#ff7a1e;animation:barGlow .16s steps(2) infinite}
@keyframes barGlow{0%{box-shadow:0 -3px 0 #ff9a3a,0 -8px 18px rgba(255,90,20,.35)}50%{box-shadow:0 -3px 0 #ffd27a,0 -14px 26px rgba(255,90,20,.6)}}
#skillBtn{position:relative;overflow:hidden}
#skillBtn .sfill{position:absolute;left:0;bottom:0;top:0;width:0;background:rgba(255,120,30,.35);transition:width .2s steps(4);pointer-events:none}
#skillBtn span{position:relative}
#skillBtn.ready{background:#ffcf3a;animation:pulse .5s steps(2) infinite}
#skillBtn.ready .sfill{background:rgba(255,60,20,.35)}
#skillBtn:disabled{cursor:default;filter:saturate(.6) brightness(.85)}

@media (max-width:480px){
  .pxbtn,#pauseBtn,.wallet,#bar .pxbtn{font-size:12px}
  #bar{gap:12px}
  #bar .pxbtn{gap:8px;padding:0 8px}
  #bar .ico-arrow{width:30px;height:20px}
  #bar .ico-burst{width:24px;height:24px}
  #bar .cmb{font-size:8px}
  .pxbtn.ko{font-size:17px}.pxbtn.ko.big{font-size:22px}
  .hud-l{font-size:12px;min-width:0;line-height:1.9}
  .hud-l .sm{font-size:8px}
  .timer .v{font-size:16px}
  .score-row .big{font-size:32px}
  .res-title{font-size:16px}
}
/* ---------- ranking ---------- */
#title{justify-content:flex-end}
#titleBottom{display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none}
.nickrow{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:6px 8px 6px 14px;font-size:18px;text-shadow:2px 2px 0 var(--ink)}
.nickrow b{color:var(--yellow);font-weight:400}
.nickrow .linkbtn{font-size:15px;padding:4px 10px}
.rankbox{pointer-events:auto;padding:10px 12px;width:min(calc(100vw - 40px),340px)}
#rankBox{margin-bottom:10px;padding:6px 10px 8px;width:min(calc(100vw - 48px),270px)}
#rankBox .rk-head{margin-bottom:4px}
#rankBox .rk-t{font-size:15px}
#rankBox .rk-mode{font-size:11px}
#rankBox .rk-list{gap:2px;min-height:0}
#rankBox .rk{grid-template-columns:22px 1fr auto;gap:6px;padding:1px 6px;font-size:14px;border-width:1px;text-shadow:1px 1px 0 var(--ink)}
#rankBox .rk .no,#rankBox .rk .sc{font-size:12px}
#rankBox .rk-empty{font-size:13px;padding:4px 2px}
#title #titleBottom{gap:10px}
#title .nickrow{font-size:15px;padding:3px 6px 3px 10px;gap:8px}
#title .nickrow .linkbtn{font-size:13px;padding:3px 8px}
@media (max-height:720px) and (max-width:899px){
  #rankBox{padding:4px 8px 6px;width:min(calc(100vw - 48px),240px);margin-bottom:6px}
  #rankBox .rk-t{font-size:13px}#rankBox .rk-mode{font-size:10px}
  #rankBox .rk{font-size:12px;padding:0 6px;line-height:1.35}
  #rankBox .rk .no,#rankBox .rk .sc{font-size:11px}
  #title #titleBottom{gap:6px}
  #title .nickrow{font-size:13px;padding:2px 4px 2px 8px}#title .nickrow .linkbtn{font-size:12px;padding:2px 6px}
}
@media (min-width:900px) and (min-height:520px){#rankBox{position:absolute;left:max(28px,env(safe-area-inset-left));top:50%;transform:translateY(-45%);margin:0;width:250px}}
.rk-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.rk-t{font-size:20px;color:var(--yellow);text-shadow:2px 2px 0 var(--ink)}
.rk-mode{font-size:13px;color:var(--cream);text-align:right;line-height:1.25}
.rk-mode.test{color:#ffb08a}
.rk-mode.online{color:#9ff0a8}
.rk-list{display:flex;flex-direction:column;gap:4px;min-height:40px}
.rk{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:4px 8px;background:rgba(0,0,0,.25);border:2px solid #1a0a04;font-size:18px;text-shadow:2px 2px 0 var(--ink)}
.rk .no{font-family:var(--px);font-size:16px;text-align:center}
.rk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cream2)}
.rk .sc{font-family:var(--px);font-size:16px;color:var(--cream2)}
.rk.r1{background:linear-gradient(90deg,rgba(246,201,58,.38),rgba(246,201,58,.08));border-color:#c88a10}.rk.r1 .no{color:#ffd84a}
.rk.r2{background:linear-gradient(90deg,rgba(210,220,228,.32),rgba(210,220,228,.06));border-color:#8a959c}.rk.r2 .no{color:#e6eef2}
.rk.r3{background:linear-gradient(90deg,rgba(208,128,64,.36),rgba(208,128,64,.06));border-color:#8a4a1e}.rk.r3 .no{color:#f0a060}
.rk.me{outline:3px solid var(--yellow);outline-offset:-1px}
.rk.me .nm:after{content:' (나)';color:var(--yellow)}
.rk-empty{font-size:16px;color:var(--cream);padding:8px 4px;text-align:center;line-height:1.4}
.rk-empty .linkbtn{margin-top:6px}
#nickModal{background:rgba(20,8,3,.7);z-index:40}
#nickModal input{font-family:var(--ko);font-size:24px;padding:10px 12px;border:3px solid var(--ink);background:var(--cream2);color:var(--ink);text-align:center;
  user-select:text;-webkit-user-select:text;touch-action:auto;outline:none;box-shadow:inset 3px 3px 0 #d9bf8a}
.nk-help{text-align:center;font-size:17px;line-height:1.4;text-shadow:2px 2px 0 var(--ink)}
.nk-help small{color:var(--yellow);font-size:15px}
.nk-err{min-height:1.3em;text-align:center;font-size:15px;color:#ffb08a;text-shadow:1px 1px 0 var(--ink)}
.best-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.best-row .lbl{color:var(--yellow);font-size:17px;text-shadow:2px 2px 0 var(--ink)}
.best-row .mid{font-family:var(--px);font-size:24px;color:var(--cream2);text-shadow:3px 3px 0 var(--ink)}
.bestnote{font-size:15px;color:var(--cream)}
.res-rank{width:100%;margin:6px 0 12px}
.save-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;min-height:28px;font-size:16px;text-shadow:1px 1px 0 var(--ink);flex-wrap:wrap;text-align:center}
.save-row .ok{color:#9ff0a8}.save-row .bad{color:#ffb08a}.save-row .info{color:var(--cream)}
#saveRetry{font-size:16px;padding:.35em .9em}
/* ---------- panels ---------- */
.panel{pointer-events:auto;padding:24px 22px;display:flex;flex-direction:column;align-items:stretch;gap:16px;width:min(calc(100vw - 40px),380px)}
.panel h2{text-align:center;font-family:var(--px);color:var(--yellow);font-size:24px;text-shadow:3px 3px 0 var(--ink);line-height:1.5}
.panel label{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--cream2);text-shadow:2px 2px 0 var(--ink)}
.panel label span{width:70px}
.panel input[type=range]{flex:1;accent-color:#f6c93a;height:28px}
#pauseMenu,#settings{background:rgba(20,8,3,.62);z-index:30}

/* ---------- result ---------- */
#result{background:rgba(15,6,2,.72);z-index:25;overflow-y:auto;justify-content:flex-start;padding:22px 14px 30px;touch-action:pan-y}
.res-card{pointer-events:auto;margin:auto;width:min(calc(100vw - 32px),880px);padding:clamp(16px,2.6vh,24px) clamp(12px,2.4vw,24px)}
.res-title{text-align:center;font-family:var(--px);color:var(--yellow);font-size:24px;text-shadow:3px 3px 0 var(--ink);line-height:1.5}
.res-title small{display:block;font-family:var(--ko);font-size:clamp(15px,2.6vmin,20px);color:var(--cream);text-shadow:2px 2px 0 var(--ink);margin-top:4px}
.res-reason{text-align:center;color:#ffb08a;font-size:16px;margin:4px 0 10px;text-shadow:2px 2px 0 var(--ink)}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.res-grid{grid-template-columns:1fr}}
.inset{background:#3e2214;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #6a3e24}
.boss-box{display:flex;align-items:flex-end;gap:8px;padding:8px;min-height:170px}
#resBoss{width:clamp(150px,36vw,220px);height:clamp(150px,36vw,210px);flex:none}
.bubble{position:relative;flex:1;align-self:center;background:var(--cream2);color:var(--ink);border:3px solid var(--ink);padding:12px 14px;
  font-size:clamp(17px,3vmin,22px);line-height:1.35;box-shadow:4px 4px 0 rgba(0,0,0,.35);min-height:3.2em;word-break:keep-all}
.bubble:before{content:'';position:absolute;left:-15px;bottom:20px;border:8px solid transparent;border-right:12px solid var(--ink)}
.pot-box{padding:8px;display:flex;flex-direction:column;align-items:center}
#resPot{width:100%;max-width:400px;aspect-ratio:16/10}
.pot-box .cap{color:var(--yellow);font-size:15px;text-shadow:2px 2px 0 var(--ink)}
.score-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 8px;flex-wrap:wrap}
.score-row .lbl{font-family:var(--px);color:var(--yellow);font-size:16px;text-shadow:2px 2px 0 var(--ink)}
.score-row .big{font-family:var(--px);font-size:40px;color:var(--cream2);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--red)}
.newbest{font-family:var(--px);background:var(--red);color:var(--cream2);border:3px solid var(--ink);padding:6px 8px;font-size:16px;animation:blink .6s steps(1) infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:8px 6px;text-align:center}
.stat .k{font-size:14px;color:var(--yellow);text-shadow:1px 1px 0 var(--ink)}
.stat .v{font-family:var(--px);font-size:16px;color:var(--cream2);text-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.stat .v img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
.stat .v .nm{font-family:var(--ko);font-size:clamp(15px,2.6vmin,18px)}
.ing-stats{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 16px}
@media (max-width:640px){.ing-stats{grid-template-columns:repeat(4,1fr)}}
.ing{padding:6px 2px;text-align:center}
.ing img{width:clamp(36px,7vmin,52px);height:clamp(36px,7vmin,52px);object-fit:contain;display:block;margin:0 auto;image-rendering:pixelated}
.ing .n{font-size:13px;color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ing .c{font-family:var(--px);color:var(--cream2);font-size:16px;margin-top:4px}
.ing.top{background:#6a3e1a;box-shadow:inset 0 0 0 2px var(--yellow)}
.res-btns{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding-bottom:8px}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="loading" class="screen">LOADING...</div>

  <div class="top-btns"><button id="soundBtn" class="pxbtn hidden" title="소리 설정">SOUND</button></div>

  <div id="title" class="screen hidden">
    <div id="rankBox" class="rankbox pxbox">
      <div class="rk-head"><span class="rk-t">🏆 TOP 3</span><span class="rk-mode" id="rkMode"></span></div>
      <div class="rk-list" id="rkList"></div>
    </div>
    <div id="titleBottom">
      <div class="nickrow pxbox"><span class="nk">👤 <b id="nickV">닉네임 없음</b></span><button id="nickEdit" class="linkbtn">닉네임 변경</button></div>
      <div class="row">
        <button id="startBtn" class="pxbtn yellow big pulse">▶ START</button>
        <button id="quickBtn" class="linkbtn">오프닝 건너뛰기</button>
      </div>
    </div>
  </div>

  <div id="nickModal" class="screen hidden">
    <div class="panel pxbox">
      <h2>NICKNAME</h2>
      <p class="nk-help">랭킹에 표시될 닉네임을 입력하세요<br><small>공백 제외 2~5자</small></p>
      <input id="nickInput" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="예) 마라왕">

<script>
(() => {
'use strict';
/* =========================================================
   왕푸 아저씨네 마라탕 — pixel-art malatang slicing arcade
   ========================================================= */
const $ = id => document.getElementById(id);
const cv = $('game'), out = cv.getContext('2d');
let lo = null, ctx = null;              // low-res pixel canvas (everything renders here)
const PI = Math.PI, TAU = PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const choice = a => a[Math.floor(Math.random() * a.length)];
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const angLerp = (a, b, k) => { let d = ((b - a + PI) % TAU + TAU) % TAU - PI; return a + d * k; };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const FONT = "'Black Han Sans','Do Hyeon','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif";
const PXF = "'Press Start 2P','Silkscreen',monospace";
const FONT_CN = "'Noto Serif CJK SC','Noto Serif CJK KR','STKaiti','KaiTi','SimSun',serif";

/* ---------------- ingredients ---------------- */
const TYPES = [
  { key: 'tofu',     name: '두부',        size: 0.98, cut: '#fffaf0', cut2: '#f1dfb8', juice: ['#fff8e6', '#f3e2bc', '#ffffff'], ono: '퐁!',        onoC: '#fff1c8' },
  { key: 'beef',     name: '소고기',      size: 1.08, cut: '#ff8590', cut2: '#c92a38', juice: ['#d81e2c', '#ff4d4d', '#ffd6d6'], ono: '촤악~!',     onoC: '#ff7a6a' },
  { key: 'noodle',   name: '중국당면',    size: 1.06, cut: 'rgba(250,252,255,.95)', cut2: 'rgba(200,212,224,.8)', juice: ['#eef4f8', '#ffffff', '#cfdbe4'], ono: '쫀드득~', onoC: '#e8f4ff' },
  { key: 'bunmoja',  name: '분모자',      size: 1.0,  cut: '#fff6e6', cut2: '#e9d2b0', juice: ['#fff6ea', '#efd9bc', '#ffffff'], ono: '통!통! 퐁당!', onoC: '#ffe7c4' },
  { key: 'blackear', name: '검은 목이버섯', size: 1.04, cut: '#b06640', cut2: '#4a1d10', juice: ['#3a160c', '#6b2f1a', '#8a4a2a'], ono: '빙글빙글~',  onoC: '#f0b080' },
  { key: 'whiteear', name: '흰 목이버섯',  size: 1.04, cut: '#fff8d8', cut2: '#ecd27e', juice: ['#fff3c2', '#ffe48a', '#ffffff'], ono: '사르르~',    onoC: '#fff0a0' },
  { key: 'enoki',    name: '팽이버섯',    size: 1.14, cut: '#fffbf0', cut2: '#ecdcbc', juice: ['#fff8ea', '#f2e2c0', '#ffffff'], ono: '촤르륵~',    onoC: '#fff6dc' },
];
const TMAP = {}; TYPES.forEach((t, i) => { t.i = i; TMAP[t.key] = t; });

/* ---------------- assets ---------------- */
const IMG = {}, SPR = {};
function loadAssets(done) {
  const keys = Object.keys(ASSETS); let n = 0;
  keys.forEach(k => {
    const im = new Image();
    const fin = () => { if (++n === keys.length) done(); };
    im.onload = () => { IMG[k] = im; fin(); };
    im.onerror = () => { const c = document.createElement('canvas'); c.width = c.height = 48; const x = c.getContext('2d'); x.fillStyle = '#f5d9a8'; x.fillRect(8, 8, 32, 32); IMG[k] = c; fin(); };
    im.src = ASSETS[k];
  });
}
function buildSprites() {
  if (!IMG.tofu) return;
  const f = clamp(Math.round(L.base * L.dpr / 54), 2, 8);
  for (const t of TYPES) {
    const src = IMG[t.key];
    const im = document.createElement('canvas'); im.width = src.width * f; im.height = src.height * f;
    const ix = im.getContext('2d'); ix.imageSmoothingEnabled = false; ix.drawImage(src, 0, 0, im.width, im.height);
    const w = im.width, h = im.height, pad = 4 * f;
    // hard pixel drop-shadow (no blur) for the arcade look
    const sil = document.createElement('canvas'); sil.width = w; sil.height = h; const sx = sil.getContext('2d');
    sx.drawImage(im, 0, 0); sx.globalCompositeOperation = 'source-in'; sx.fillStyle = 'rgba(10,3,0,.55)'; sx.fillRect(0, 0, w, h);
    const c = document.createElement('canvas'); c.width = w + pad * 2; c.height = h + pad * 2; const x = c.getContext('2d');
    x.drawImage(sil, pad + 2 * f, pad + 3 * f); x.drawImage(im, pad, pad);
    SPR[t.key] = { im, sh: c, w, h, pad, max: Math.max(w, h) };
  }
}

const Snd = (() => {
  let ac = null, master, mG, sG, nbuf, shaper;
  const S = { vm: LS.get('mlt_vm', 0.6), vs: LS.get('mlt_vs', 0.85), muted: LS.get('mlt_mute', false) };
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const n2f = n => { const m = /^([A-G])(#?)(\d)$/.exec(n); const midi = 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] ? 1 : 0); return 440 * Math.pow(2, (midi - 69) / 12); };

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
    comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = 0.9; master.connect(comp);
    mG = ac.createGain(); sG = ac.createGain(); mG.connect(master); sG.connect(master);
    nbuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    shaper = ac.createWaveShaper(); const cur = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; cur[i] = Math.tanh(x * 2.4); } shaper.curve = cur;
    apply();
  }
  function apply() {
    if (!ac) return; const m = S.muted ? 0 : 1; const t = ac.currentTime;
    mG.gain.setTargetAtTime(S.vm * m * 0.8, t, 0.03); sG.gain.setTargetAtTime(S.vs * m, t, 0.03);
  }
  const ok = () => ac && ac.state === 'running';
  function env(dest, t, a, peak, dec, hold = 0) {
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    if (hold) g.gain.setValueAtTime(Math.max(peak, 0.0002), t + a + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + dec); g.connect(dest); return g;
  }
  function osc(type, f, t, dur, dest) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o; }
  function noise(t, dur, dest) { const s = ac.createBufferSource(); s.buffer = nbuf; s.loop = true; s.connect(dest); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05); return s; }
  function filt(type, f, q, dest) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 1; b.connect(dest); return b; }

  /* ---- instruments ---- */

    if (src) G.steam.push({ x: src.x + rand(-20, 20), y: src.y, vx: rand(-8, 8), vy: -rand(20, 40), s: rand(40, 80), t: 0, life: rand(1.8, 3), ph: rand(0, TAU) });

    if (!G.fever && G.time <= 10) { G.fever = true; G.banner = { text: 'FEVER TIME!', sub: '마지막 10초! 마구 썰어라!', t: 0, life: 1.8, px: true }; Snd.fanfare(2); Snd.setRate(1.12); }
    if (!G.skillAnim) { G.spawnT -= dt; if (G.spawnT <= 0 && G.time > 0.8) spawnWave(); }

  G.items = G.items.filter(it => { if (it.vy > 0 && it.y - it.size * 0.5 > H) { missItem(it); return false; } return true; });
  for (const h of G.halves) {

    h.x += h.vx * dt; h.y += h.vy * dt; h.ang += h.va * dt;

      if (f.t > 0.48 && !f.b2) { f.b2 = true; ripple(f.x, f.y, L.base * 0.85, 0.9); ripple(f.x, f.y, L.base * 0.5, 0.7); brothDrops(f.x, f.y, 14, { v: 2.6, spread: 0.7 }); }

  for (const s of G.stains) s.t += dt; G.stains = G.stains.filter(s => s.t < s.life);
  for (const f of G.flashes) f.t += realDt; G.flashes = G.flashes.filter(f => f.t < f.life);
  for (const f of G.slashes) f.t += realDt; G.slashes = G.slashes.filter(f => f.t < f.life);

/* ---- Firebase backend ---- */
async function FirebaseBackend(cfg) {
  const mods = window.__FB_MODULES || await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(FIREBASE_SDK + f)));
  const [APP, AUTH, FS] = mods;
  const app = APP.initializeApp(cfg);
  const auth = AUTH.getAuth(app);
  const cred = await AUTH.signInAnonymously(auth);           // persisted by Firebase in this browser
  const uid = cred.user.uid;
  const db = FS.getFirestore(app);
  const ref = id => FS.doc(db, 'scores', id);
  const toRec = d => { const x = d.data() || {}; const t = x.achievedAt; return { pid: d.id, nick: String(x.nick || '???').slice(0, 12), score: Number(x.score) || 0, achievedAt: t && t.toMillis ? t.toMillis() : Number(t) || 0 }; };
  return {
    mode: 'firebase', readOnly: false, label: '🌐 온라인 랭킹', uid,
    async top() {
      const snap = await FS.getDocs(FS.query(FS.collection(db, 'scores'), FS.orderBy('score', 'desc'), FS.limit(60)));
      return bestPerNick(sortRows(snap.docs.map(toRec))).slice(0, 3);
    },
    async mine() { const d = await FS.getDoc(ref(uid)); return d.exists() ? toRec(d) : null; },
    async submit(rec) {
      return FS.runTransaction(db, async tx => {
        const r = ref(uid); const d = await tx.get(r);
        if (d.exists()) {
          const cur = d.data();
          if ((Number(cur.score) || 0) >= rec.score) { if (cur.nick !== rec.nick) tx.update(r, { nick: rec.nick }); return { updated: false, best: Number(cur.score) || 0 }; }
        }
        tx.set(r, { nick: rec.nick, score: Math.floor(rec.score), achievedAt: FS.serverTimestamp() });
        return { updated: true, best: rec.score };
      });
    },
    /* duplicate nicknames are allowed: each player is told apart by uid */
    async rename(pid, nick) { return this.claimNick(pid, nick); },
    async claimNick(pid, nick) {
      const me = await FS.getDoc(ref(uid));
      if (me.exists() && me.data().nick !== nick) await FS.updateDoc(ref(uid), { nick });
    },
  };
}

document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
function goTitle() {
  state = 'title'; paused = false; hideAll(); Snd.stopMusic(); Snd.setRate(1); G.steam = [];
  $('title').classList.remove('hidden'); $('soundBtn').classList.remove('hidden'); renderNick(); renderRanks(); if (Rank.be) Rank.refresh(); else Rank.init();
  $('quickBtn').classList.remove('hidden');
  TB.boss = newBoss(); TB.boss.expr = 'talk'; bossAction(TB.boss, 'raise');
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let last = performance.now(), clock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now; if (paused) dt = 0; clock += dt;
  try {
    ctx.clearRect(0, 0, L.W, L.H);
    switch (state) {
      case 'title': updateBrothFx(dt); drawTitle(clock, dt); break;
      case 'intro': updateIntro(dt); drawIntro(clock); break;
      case 'countdown': updateCountdown(dt); drawGameScene(clock); drawCountdown(); break;
      case 'play': updatePlay(dt); drawGameScene(clock); break;
      case 'timeup': G.timeupT += dt; updatePlay(dt); drawGameScene(clock); drawTimeUp(); if (G.timeupT > 2.6) showResult(); break;
      case 'result': updatePlay(dt); drawGameScene(clock); updateResult(dt); break;
    }
    present();
  } catch (err) { console.error(err); }
}
window.addEventListener('resize', () => { resize(); if (state === 'result') drawFinishedPot(); });
window.__WF = { G, L, get state() { return state; }, startGame, showResult, spawnItem, activateSkill, Rank, Player, LocalBackend };

resize();
loadAssets(() => {
  buildSprites(); resetGame();
  $('loading').classList.add('hidden'); goTitle(); syncVol();
  if (!validNick(Player.nick)) openNick(null, false);
  requestAnimationFrame(frame);
});
})();

</script>
</body>
</html>
